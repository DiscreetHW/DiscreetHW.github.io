<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Авторизация · Малиновка</title>
<meta name="description" content="Малиновка: онлайн-игра про Россию. Голосовой чат, фракции, работы и уникальные автомобили.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0f11">
<link rel="icon" href="https://malinovka.org/img/logo/default.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
<main>
<section class="auth">
  <div class="auth-art"><div class="bgimg" style="background-image:url('https://malinovka.org/img/login/background.jpg')"></div><div class="cap"><span class="kicker">Малиновка</span><h2 style="margin-top:16px">Онлайн-игра<br>про Россию</h2></div></div>
  <div class="auth-box"><form class="form" id="lf" autocomplete="off">
  <h1>Авторизация</h1><p class="lead">Войдите в личный кабинет</p>
  <label class="field"><span>Логин</span><input name="l" placeholder="Введите логин"></label>
  <label class="field"><span>Пароль</span><input name="p" type="password" placeholder="Введите пароль"></label>
  <label class="field code-field"><span>Код</span><input name="c" placeholder="Введите код"></label>
  <div class="row"><span></span><a href="restore.html">Забыли пароль?</a></div>
  <button class="btn btn-red btn-block">Авторизоваться</button>
  <p class="alt">Нет аккаунта? <a href="register.html">Регистрация</a></p>
</form></div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
